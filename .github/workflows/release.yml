name: Release

# Push a tag such as v0.1.0 (matching <Version> in Directory.Build.props) on a commit of main. The installer is built
# and tested with read-only rights, a separate job attests its build provenance, and another attaches it to a draft
# release for a maintainer to publish.
on:
  push:
    tags: ['v*']

permissions: {}

# One release run per tag at a time; a second push of the same tag waits instead of racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Passed through the environment, never pasted into scripts.
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the tag can be checked against main.
          fetch-depth: 0
      - name: Check the tag names the version being built
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag $env:TAG is not vMAJOR.MINOR.PATCH; delete it and tag again." }
          $tagVersion = $Matches[1]
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tagVersion -ne $version) { throw "Tag $env:TAG does not match <Version>$version</Version> in Directory.Build.props; fix one of them and tag again." }
      - name: Check the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on main; releases are built only from reviewed commits." }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The newest .NET 10 patch: a self-contained release ships its runtime.
          dotnet-version: 10.0.x
      - name: Show the SDK and runtime that will ship
        run: dotnet --info
      # pdfium and qpdf, each checked against the SHA256 in scripts/deps.json before it is unpacked (ADR-0008).
      - name: Fetch third-party tools
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Build
        id: build
        run: dotnet build Flevert.sln -c Release
      # One project at a time, as in ci.yml and setup-dev.ps1: together they starve the process-batching tests.
      - name: Test core
        run: dotnet test tests/Flevert.Core.Tests -c Release --no-build
      - name: Test images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Image.Tests -c Release --no-build
      - name: Test PDF
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Pdf.Tests -c Release --no-build
      - name: No known-vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list Flevert.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }
      - name: Install Inno Setup 6.7.3 (official release, hash checked)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download does not match its published hash' }
          $dir = "$env:RUNNER_TEMP\inno"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found in $dir" }
      - name: Build installer
        shell: pwsh
        # The compiler just installed, not whatever else the runner image has on PATH.
        run: ./scripts/build-installer.ps1 -Iscc "$env:RUNNER_TEMP\inno\ISCC.exe"
      - name: Write checksums
        shell: pwsh
        run: |
          $setup = Get-Item "artifacts/installer/Flevert-Setup-$($env:TAG.TrimStart('v')).exe" -ErrorAction Stop
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $setup.Name |
            Out-File artifacts/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            artifacts/installer/Flevert-Setup-*.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

  attest:
    # Separate from the build, so the code that runs tests and third-party build steps never holds a token that can
    # sign attestations.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/Flevert-Setup-*.exe

  release:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - name: Write the release notes
        # This version's CHANGELOG section, then how to check the download before "Run anyway" (unsigned build).
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version"; exit 1; fi
          cat >> notes.md <<EOF

          ## Check your download

          This build is not code-signed yet, so Windows shows **Windows protected your PC**. Before you click **More info > Run anyway**:

          1. In PowerShell: \`Get-FileHash .\\Flevert-Setup-$version.exe\` must match \`SHA256SUMS.txt\` below.
          2. With the [GitHub CLI](https://cli.github.com/) (after \`gh auth login\`), check that this repository's release workflow built it from commit \`$GITHUB_SHA\`:

             \`\`\`
             gh attestation verify Flevert-Setup-$version.exe --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$TAG --source-digest $GITHUB_SHA --deny-self-hosted-runners
             \`\`\`
          EOF
          cat notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" installer/* --draft --notes-file notes.md --title "Flevert $TAG"
