name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand for the release check: three runs of one commit at once (docs/RELEASING.md).
  workflow_dispatch:

permissions:
  contents: read

env:
  # MSBuild reads it as a property: the binaries name /_/ for the checkout, not the runner's folders (checked below), as
  # the release's do.
  ContinuousIntegrationBuild: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The newest .NET 10 patch, as release.yml uses; global.json accepts any 10.0 SDK from 10.0.100.
          dotnet-version: 10.0.x
      # pdfium and qpdf, each checked against the SHA256 in scripts/deps.json before it is unpacked (ADR-0008).
      - name: Fetch third-party tools
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - id: build
        run: dotnet build Flevert.sln -c Release
      - name: No build machine paths in the binaries
        shell: pwsh
        run: ./scripts/test-build-paths.ps1 -Folder src
      - run: dotnet format Flevert.sln --verify-no-changes
      # One project at a time: run together, the image encodes starved the process-batching tests on the runner (a 1 s
      # copy took 15 s). Separate steps, and the second runs even if the first fails, so neither hides the other.
      # A new test project must be added here, in release.yml, in scripts/setup-dev.ps1 and in the docs that list the
      # test commands (git grep "dotnet test tests/").
      - run: dotnet test tests/Flevert.Core.Tests -c Release --no-build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Image.Tests -c Release --no-build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Pdf.Tests -c Release --no-build
      - name: No known-vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list Flevert.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

  # The Linux version (docs/specs/linux.md, ADR-0010): the same projects built for plain .NET, the Linux tests, the
  # Python tests of the scripts, the Nautilus extension and install.sh, and the package.
  build-and-test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # What the Linux side calls in the tests: fontconfig and a font with Vietnamese letters for the watermark, GLib's
      # Python bindings to check the order of names against GLib itself, and zenity and gdbus, which install.sh requires.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-liberation2 python3-gi zenity libglib2.0-bin
      # pdfium and qpdf for Linux, each checked against the SHA256 in scripts/deps-linux.json before it is unpacked.
      - name: Fetch third-party tools
        run: python3 -I scripts/fetch-deps-linux.py
      - id: build
        run: dotnet build Flevert.sln -c Release
      - run: dotnet format Flevert.sln --verify-no-changes
      # One project at a time, as on Windows.
      - run: dotnet test tests/Flevert.Core.Tests -c Release --no-build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Image.Tests -c Release --no-build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Flevert.Pdf.Tests -c Release --no-build
      - if: ${{ !cancelled() }}
        name: Python tests
        run: |
          python3 -I -m unittest discover -s scripts -p 'test_*.py'
          python3 -I -m unittest discover -s src/Flevert.Linux/nautilus -p 'test_*.py'
          python3 -I -m unittest discover -s packaging/linux -p 'test_*.py'
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Package
        run: scripts/build-linux.sh
