name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security problems go privately through SECURITY.md, not in a public issue.
  - type: input
    id: version
    attributes:
      label: Flevert version
      description: Settings > Apps > Installed apps
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Which menu item, on which kind of file (a photo, a PDF), and how many files?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The matching lines from %LOCALAPPDATA%\Flevert\logs, if any. They contain file names, folders and your Windows user name; replace anything private before posting.
      render: text
