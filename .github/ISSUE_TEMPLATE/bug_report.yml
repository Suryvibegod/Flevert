name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Security problems go through SECURITY.md instead, not a public issue.
  - type: input
    id: version
    attributes:
      label: ConvertAnything version
      description: Settings > Apps > Installed apps
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Which menu item, on which kind of file (and how many files)?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The matching lines from %LOCALAPPDATA%\ConvertAnything\logs, if any. Remove anything private.
      render: text
