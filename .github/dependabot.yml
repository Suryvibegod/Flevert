version: 2
updates:
  # Actions are pinned by commit; Dependabot proposes the new commit and release name together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Magick.NET bundles ImageMagick and its decoders, the main attack surface (ADR-0004).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
